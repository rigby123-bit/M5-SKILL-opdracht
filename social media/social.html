<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Card</title>
    <link rel="stylesheet" href="social.css">
</head>
<body>
    <div class="instagram-card">
        <div class="card-header">
            <img src="Screenshot 2025-11-03 123549.png" alt="Profile Picture" class="profile-pic">
            <span class="username">skibidi toilet</span>
        </div>
        <div class="card-image">
            <img src="Screenshot 2025-11-03 123549.png" alt="Post Image">
        </div>
        <div class="card-body">
            <div class="card-actions">
                <div class="left-actions">
                    <i class="fas fa-heart"></i>
                    <i class="fas fa-comment"></i>
                    <i class="fas fa-paper-plane"></i>
                </div>
                <div class="right-actions">
                    <i class="fas fa-bookmark"></i>
                </div>
            </div>
            <div class="likes-count">123 likes</div>
            <div class="caption"><span class="username">skibidi toilet</span> dagje uit</div>
        </div>
    </div>
</body>
</html>
